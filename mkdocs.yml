site_name: Документация
site_description: "Описание используемых продуктов"
site_author: "Михаил Агупов"
site_url: "https://agupov1974.github.io/mkdocs/"

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  language: ru

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true 
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Главная: index.md
  - Начало работы: getting-started.md
  - MkDocs: mkdocs.md
